name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew :plugin:test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            plugin/build/reports/tests/test
            plugin/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

  integration-test:
    name: Integration tests (Play 2.8 + 3.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run integration tests
        run: ./gradlew :plugin:jar :integration-test:test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: |
            integration-test/build/reports/tests/test
            integration-test/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package plugin jar
    needs: [unit-test, integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build plugin jar
        run: ./gradlew clean :plugin:jar
      - name: Stage artifact and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp plugin/build/libs/memshell-party-playframework-plugin-*.jar dist/
          cd dist
          sha256sum ./*.jar > SHA256SUMS
          cat SHA256SUMS
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: memshell-party-playframework-plugin
          path: dist/
          if-no-files-found: error
          retention-days: 30

  verify-artifact:
    name: Verify downloaded artifact
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: memshell-party-playframework-plugin
          path: downloaded
      - name: Check checksum and jar layout
        run: |
          set -euo pipefail
          cd downloaded
          sha256sum -c SHA256SUMS
          JAR=$(find "$PWD" -maxdepth 1 -name '*.jar' -print -quit)
          test -n "$JAR"
          echo "Checking $JAR"
          jar tf "$JAR" | sort
          unzip -p "$JAR" META-INF/memshell-party-plugin.properties
          unzip -p "$JAR" META-INF/services/com.reajason.javaweb.memshell.spi.ServerProvider
      - name: Run integration tests against the downloaded jar
        run: |
          set -euo pipefail
          JAR=$(find "$PWD/downloaded" -maxdepth 1 -name '*.jar' -print -quit)
          test -n "$JAR"
          ./gradlew --no-build-cache :integration-test:test -PpluginJar="$JAR"
