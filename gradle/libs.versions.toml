[versions]
play2 = "2.8.20"
play3 = "3.0.8"
junit-jupiter = "5.14.4"
junit-platform = "1.14.4"
logback = "1.5.38"
lombok = "9.5.0"

[libraries]
play2-core = { module = "com.typesafe.play:play_2.13", version.ref = "play2" }
play2-java = { module = "com.typesafe.play:play-java_2.13", version.ref = "play2" }
play2-server = { module = "com.typesafe.play:play-server_2.13", version.ref = "play2" }
