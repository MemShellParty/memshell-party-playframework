play2-logback = { module = "com.typesafe.play:play-logback_2.13", version.ref = "play2" }
play3-core = { module = "org.playframework:play_2.13", version.ref = "play3" }
play3-java = { module = "org.playframework:play-java_2.13", version.ref = "play3" }
play3-server = { module = "org.playframework:play-server_2.13", version.ref = "play3" }
play3-pekko-http-server = { module = "org.playframework:play-pekko-http-server_2.13", version.ref = "play3" }
